# Lightweight CI: typecheck + unit tests only.
#
# Out of scope: browser integration tests, e2e, deployment, and model downloads.
#
# Not complete coverage:
# - apps/api and apps/web typecheck scripts currently skip because those
#   scaffolds have no application sources yet (echo + skip, not tsc).
# - `test:unit` is `vitest run tests/unit --passWithNoTests`, so an empty
#   suite exits 0 and is not full coverage.
#
# Failures are not masked (no continue-on-error). No repository secrets.
# Uses pull_request (not pull_request_target) so contributor code is not
# executed with extra privileges.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun (packageManager from package.json)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: bun run typecheck
        run: bun run typecheck

      - name: bun run test:unit
        run: bun run test:unit
