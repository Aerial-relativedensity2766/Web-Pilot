name: Feature request
description: Suggest an improvement focused on a real user problem
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** and the outcome you want. An implementation design is optional.
        Do not include secrets, personal browsing data, or private files.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: What would success look like for a user?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried or considered
    validations:
      required: false
