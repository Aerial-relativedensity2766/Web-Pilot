name: Bug report
description: Report something that does not work as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WebPilot. **Do not** paste secrets, session files, personal browsing data, or private downloads.
        Security-sensitive bugs belong in a [private security advisory](https://github.com/missarii/Web-Pilot/security), not here.
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      description: Output of `bun --version` (package.json pins `bun@1.4.0`)
      placeholder: "1.4.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Relevant package / area
      options:
        - packages/agent-core
        - packages/ai-core
        - packages/browser-core
        - packages/download-core
        - packages/extraction-core
        - packages/schemas
        - packages/shared
        - apps/api (scaffold)
        - apps/web (scaffold)
        - apps/test-site
        - tests / tooling
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps someone else can follow
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Redact paths, cookies, tokens, and personal content. Prefer `WEBPILOT_LOG_LEVEL=debug` snippets.
    validations:
      required: false
